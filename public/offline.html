<body><main class="card"><span class="mark">M</span><span class="status">オフライン</span><h1>接続を待っています</h1><p>入力内容は送信されていません。通信が戻ったら、もう一度読み込んでください。</p><button type="button" onclick="location.reload()">再読み込み</button><small>MatchPilotは接続が戻るまで外部サービスを操作しません。</small></main></body>
